# Broker Mosquitto para la práctica de MQTT (diapositivas 4 y 5), versión Linux:
#   mosquitto -c herramientas/broker.conf -v
# Escucha en todas las interfaces para que la ESP32 y el visor se conecten por Wi-Fi, sin usuario ni contraseña.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
